<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas — confirmar borrado</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
    .registro { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0 1.5rem; word-break: break-word; }
    button.borrar { background: #b00020; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    a.cancelar { margin-left: 1rem; }

    @media (max-width: 480px) {
      body { margin: 1.5rem auto; }
    }
  </style>
</head>
<body>
  <h1>¿Borrar este registro?</h1>
  <div class="registro">
    #{{ entry.id }} — {{ format_entry_summary(entry) }}<br>
    Fecha: {{ entry.created_at or "Fecha desconocida" }}
  </div>
  <form method="post" action="{{ url_for('borrar', entry_id=entry.id) }}">
    <button type="submit" class="borrar">Sí, borrar</button>
    <a class="cancelar" href="{{ url_for('index') }}">Cancelar</a>
  </form>
</body>
</html>
